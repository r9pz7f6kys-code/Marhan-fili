name: Wire Marhan Filo enhancements
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inject-enhancements.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refresh enhancement script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="enhancements.js?v=4"></script>'
          if re.search(r'<script src="enhancements\.js\?v=\d+"></script>',s):
              s=re.sub(r'<script src="enhancements\.js\?v=\d+"></script>',tag,s)
          elif tag not in s:
              s=s.replace('</body>',tag+'</body>')
          p.write_text(s)
          PY
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "Refresh Marhan enhancements v4" && git push)
