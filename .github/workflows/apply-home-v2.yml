name: Apply home v2
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-home-v2.yml'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add home v2 loader
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          tag='<script src="home-v2.js?v=3"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'</body>')
              p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Enable Santiye Yakit Tamir home screen"
          git push