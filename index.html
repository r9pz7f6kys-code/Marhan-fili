<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0e11"><title>Marhan Filo</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#0c0e11;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.hidden{display:none!important}header{padding:16px;background:#15191e;border-bottom:1px solid #2b323a}.logo{font-size:24px;font-weight:900}.logo span{color:#f2b632}.muted{color:#aeb6c0;font-size:13px}main{max-width:900px;margin:auto;padding:14px}.card{background:#171b20;border:1px solid #2b323a;border-radius:17px;padding:16px;margin-bottom:13px}.auth{max-width:430px;margin:35px auto}input{width:100%;padding:13px;margin:5px 0;border:1px solid #3a424c;border-radius:11px;background:#0c0e11;color:#fff;font-size:16px}button{width:100%;border:0;border-radius:11px;padding:13px;margin-top:7px;font-weight:800;font-size:15px;background:#f2b632;color:#111}.secondary{background:#29313a;color:#fff}.notice{padding:11px;border-radius:11px;background:#242b32;margin:9px 0;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.box{background:#222830;border-radius:14px;padding:14px}.num{font-size:25px;font-weight:900;color:#f2b632}</style></head><body><header><div class="logo"><span>MARHAN</span> FİLO</div><div class="muted">Merkezi Filo • Bakım • Masraf Yönetimi</div></header><main><section id="authView" class="card auth"><h2>Marhan Filo Giriş</h2><p class="muted">Yetkili hesabınızla giriş yapın.</p><form id="authForm"><input id="email" type="email" autocomplete="email" required placeholder="E-posta"><input id="password" type="password" autocomplete="current-password" minlength="8" required placeholder="Şifre"><button id="loginBtn" type="submit">Giriş Yap</button></form><button id="forgotBtn" type="button" class="secondary">Şifremi Unuttum</button><div id="authMsg" class="notice hidden"></div></section><section id="appView" class="hidden"><div class="card"><h2>Filo Özeti</h2><div id="welcome" class="muted"></div><div class="grid"><div class="box"><div id="vehicleCount" class="num">0</div><div class="muted">Araç/Makine</div></div><div class="box"><div id="maintenanceCount" class="num">0</div><div class="muted">Bakım</div></div></div><button id="logout" class="secondary">Çıkış Yap</button></div><div class="card"><h2>Giriş sistemi hazır</h2><p class="muted">Önce girişin sorunsuz çalıştığını doğruluyoruz. Menü ve yeni filo özellikleri giriş doğrulandıktan sonra bu sağlam yapı üzerine eklenecek.</p></div></section></main><script>const SUPABASE_URL='https://qccpcepsgfepuyltamae.supabase.co';const SUPABASE_KEY='sb_publishable_mKOALiZdR_RpkMt028nbIA_vOv0epVz';const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const $=id=>document.getElementById(id);function msg(t){$('authMsg').textContent=t;$('authMsg').classList.remove('hidden')}function clearMsg(){$('authMsg').classList.add('hidden')}async function authState(){const {data:{session},error:sessionError}=await db.auth.getSession();if(sessionError){msg('Oturum kontrolü yapılamadı: '+sessionError.message);return}if(!session){$('authView').classList.remove('hidden');$('appView').classList.add('hidden');return}const {data:member,error}=await db.from('company_members').select('role,email').eq('user_id',session.user.id).maybeSingle();if(error){msg('Yetki kontrolü yapılamadı: '+error.message);return}if(!member){await db.auth.signOut();msg('Bu hesap Marhan Filo için yetkili değil.');return}$('authView').classList.add('hidden');$('appView').classList.remove('hidden');$('welcome').textContent=session.user.email+' • '+(member.role==='admin'?'Yönetici':'Kullanıcı');const [a,b]=await Promise.all([db.from('araclar').select('id',{count:'exact',head:true}),db.from('bakimlar').select('id',{count:'exact',head:true})]);$('vehicleCount').textContent=a.count||0;$('maintenanceCount').textContent=b.count||0}document.addEventListener('DOMContentLoaded',()=>{$('authForm').addEventListener('submit',async e=>{e.preventDefault();clearMsg();const email=$('email').value.trim();const password=$('password').value;const btn=$('loginBtn');btn.disabled=true;btn.textContent='Giriş yapılıyor...';try{const {error}=await db.auth.signInWithPassword({email,password});if(error){msg('Giriş yapılamadı: '+error.message);return}await authState()}catch(err){msg('Bağlantı hatası: '+(err?.message||String(err)))}finally{btn.disabled=false;btn.textContent='Giriş Yap'}});$('forgotBtn').addEventListener('click',async()=>{const email=$('email').value.trim();if(!email){msg('Önce e-posta adresini yaz.');return}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});msg(error?'Şifre bağlantısı gönderilemedi: '+error.message:'Şifre yenileme bağlantısı e-posta adresine gönderildi.')});$('logout').addEventListener('click',async()=>{await db.auth.signOut();location.reload()});authState()});</script></body></html>
