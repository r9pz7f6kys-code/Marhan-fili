<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Marhan Filo</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,Arial;background:#0c0e11;color:white}
header{padding:22px;background:#15191e;border-bottom:1px solid #2c3239}
.logo{font-size:25px;font-weight:900}
.logo span{color:#f2b632}
.sub{color:#9da6b0;margin-top:5px}
main{padding:18px;max-width:700px;margin:auto}
.card{background:#171b20;border:1px solid #2b323a;border-radius:18px;padding:18px;margin-bottom:14px}
h2{margin-top:0}
button{width:100%;padding:15px;margin-top:10px;border:0;border-radius:13px;background:#f2b632;font-size:16px;font-weight:800}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.box{background:#222830;border-radius:14px;padding:15px;text-align:center}
.num{font-size:27px;font-weight:900}
.small{font-size:13px;color:#aeb6c0}
</style>
</head>

<body>

<header>
<div class="logo"><span>MARHAN</span> FİLO</div>
<div class="sub">Araç • Makine • Bakım Yönetimi</div>
</header>

<main>

<div class="card">
<h2>Filo Özeti</h2>
<div class="grid">
<div class="box">
<div class="num">15</div>
<div class="small">Kamyon</div>
</div>
<div class="box">
<div class="num">5</div>
<div class="small">Ekskavatör</div>
</div>
<div class="box">
<div class="num">1</div>
<div class="small">Silindir</div>
</div>
<div class="box">
<div class="num">1</div>
<div class="small">CAT 963</div>
</div>
</div>
</div>

<div class="card">
<h2>Filo Yönetimi</h2>
<button>Araç / Makine Ekle</button>
<button>Bakım Kaydı Ekle</button>
<button>Lastik Takibi</button>
<button>Değişen Parçalar</button>
</div>

<div class="card">
<h2>Bakım Uyarıları</h2>
<div class="small">Yaklaşan ve geciken bakımlar burada gösterilecek.</div>
</div>

</main>

</body>
</html>
