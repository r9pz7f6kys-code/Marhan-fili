<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0c0e11"><title>Marhan Filo</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#0c0e11;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.hidden{display:none!important}header{padding:16px;background:#15191e;border-bottom:1px solid #2b323a}.logo{font-size:24px;font-weight:900}.logo span{color:#f2b632}.muted{color:#aeb6c0;font-size:13px}main{max-width:900px;margin:auto;padding:14px}.card{background:#171b20;border:1px solid #2b323a;border-radius:17px;padding:16px;margin-bottom:13px}.auth{max-width:430px;margin:35px auto}input{width:100%;padding:13px;margin:5px 0;border:1px solid #3a424c;border-radius:11px;background:#0c0e11;color:#fff;font-size:16px}button{width:100%;border:0;border-radius:11px;padding:13px;margin-top:7px;font-weight:800;font-size:15px;background:#f2b632;color:#111}.secondary{background:#29313a;color:#fff}.notice{padding:11px;border-radius:11px;background:#242b32;margin:9px 0;font-size:14px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.box{background:#222830;border-radius:14px;padding:14px}.num{font-size:25px;font-weight:900;color:#f2b632}</style></head><body><header><div class="logo"><span>MARHAN</span> FİLO</div><div class="muted">Merkezi Filo • Bakım • Masraf Yönetimi</div></header><main><section id="authView" class="card auth"><h2>Marhan Filo Giriş</h2><p class="muted">Yetkili hesabınızla giriş yapın.</p><div id="loginBox"><input id="email" type="email" inputmode="email" autocomplete="username" placeholder="E-posta"><input id="password" type="password" autocomplete="current-password" placeholder="Şifre"><button id="loginBtn" type="button">Giriş Yap</button><button id="forgotBtn" type="button" class="secondary">Şifremi Unuttum</button></div><div id="authMsg" class="notice hidden"></div></section><section id="appView" class="hidden"><div class="card"><h2>Filo Özeti</h2><div id="welcome" class="muted"></div><div class="grid"><div class="box"><div id="vehicleCount" class="num">0</div><div class="muted">Araç/Makine</div></div><div class="box"><div id="maintenanceCount" class="num">0</div><div class="muted">Bakım</div></div></div><button id="logout" type="button" class="secondary">Çıkış Yap</button></div></section></main><script>const db=supabase.createClient('https://qccpcepsgfepuyltamae.supabase.co','sb_publishable_mKOALiZdR_RpkMt028nbIA_vOv0epVz');const $=id=>document.getElementById(id);function msg(t){$('authMsg').textContent=t;$('authMsg').classList.remove('hidden')}async function enter(session){if(!session)return;const q=await db.from('company_members').select('role,email').eq('user_id',session.user.id).maybeSingle();if(q.error){msg('Yetki kontrolü yapılamadı: '+q.error.message);return}if(!q.data){await db.auth.signOut();msg('Bu hesap Marhan Filo için yetkili değil.');return}$('authView').classList.add('hidden');$('appView').classList.remove('hidden');$('welcome').textContent=session.user.email+' • '+(q.data.role==='admin'?'Yönetici':'Kullanıcı');const a=await db.from('araclar').select('id',{count:'exact',head:true});const b=await db.from('bakimlar').select('id',{count:'exact',head:true});$('vehicleCount').textContent=a.count||0;$('maintenanceCount').textContent=b.count||0}async function login(){const email=$('email').value.trim(),password=$('password').value;if(!email||!password){msg('E-posta ve şifreyi yaz.');return}const btn=$('loginBtn');btn.disabled=true;btn.textContent='Giriş yapılıyor...';msg('Giriş kontrol ediliyor...');try{const r=await db.auth.signInWithPassword({email,password});if(r.error){msg('Giriş yapılamadı: '+r.error.message);return}await enter(r.data.session)}catch(e){msg('Bağlantı hatası: '+(e.message||e))}finally{btn.disabled=false;btn.textContent='Giriş Yap'}}$('loginBtn').onclick=login;$('password').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();login()}});$('forgotBtn').onclick=async()=>{const email=$('email').value.trim();if(!email){msg('Önce e-posta adresini yaz.');return}const r=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+location.pathname});msg(r.error?'Gönderilemedi: '+r.error.message:'Şifre yenileme bağlantısı e-postana gönderildi.')};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};db.auth.getSession().then(r=>{if(r.data.session)enter(r.data.session)}).catch(e=>msg('Oturum hatası: '+e.message));</script></body></html>
